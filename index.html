<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TestWebDeploy</title>
<style>
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		background: #1a1f29;
		color: #f0f0f0;
		display: flex;
		flex-direction: column;
		align-items: center;
		min-height: 100vh;
		padding: 20px;
	}
	h1 {
		margin: 0 0 4px 0;
		font-size: 1.4rem;
	}
	p.subtitle {
		margin: 0 0 16px 0;
		color: #9aa5b1;
		font-size: 0.9rem;
	}
	.controls {
		display: flex;
		gap: 10px;
		margin-bottom: 16px;
		flex-wrap: wrap;
		justify-content: center;
		max-width: 1280px;
	}
	.controls .group {
		display: flex;
		gap: 8px;
		padding: 6px;
		border: 1px solid #2a3441;
		border-radius: 10px;
	}
	button {
		background: #1c2530;
		color: #fff;
		border: 1px solid #33404f;
		border-radius: 6px;
		padding: 10px 16px;
		cursor: pointer;
		font-size: 14px;
	}
	button:hover { background: #28323f; }
	button:active { background: #333f4e; }
	.frame-wrap {
		width: 100%;
		max-width: 1280px;
		aspect-ratio: 16 / 9;
		background: #000;
		border-radius: 8px;
		overflow: hidden;
		border: 1px solid #2a3441;
	}
	iframe {
		border: none;
		width: 100%;
		height: 100%;
	}
	.hint {
		margin-top: 12px;
		color: #6b7686;
		font-size: 0.8rem;
		text-align: center;
	}
</style>
</head>
<body>

<h1>Godot Web Export Showcase</h1>
<p class="subtitle">External controls (below) drive the embedded game live, via JavaScriptBridge.</p>

<div class="controls">
	<div class="group">
		<button onclick="callGame('gameSetBoxGreen')">Green Cube</button>
		<button onclick="callGame('gameSetBoxRed')">Red Cube</button>
		<button onclick="callGame('gameTogglePlayPause')">Play/Pause Cube</button>
	</div>
	<div class="group">
		<button onclick="callGame('gameCycleCamera')">Cycle Camera</button>
		<button onclick="callGame('gameNextScene')">Next Scene</button>
	</div>
	<div class="group">
		<button onclick="callGame('gameSetLanguageEn')">EN</button>
		<button onclick="callGame('gameSetLanguagePl')">PL</button>
	</div>
	<div class="group">
		<input type="file" id="skinUpload" accept="image/*" style="display:none">
		<button onclick="document.getElementById('skinUpload').click()">Upload Skin</button>
	</div>
</div>

<div class="frame-wrap">
	<iframe id="gameFrame" src="TestWebDeploy.html" allow="autoplay" title="Godot game"></iframe>
</div>

<p class="hint">Buttons only work once the game has finished loading inside the frame.</p>

<script>
function callGame(fnName, ...args) {
	var frame = document.getElementById('gameFrame');
	var win = frame && frame.contentWindow;
	if (win && typeof win[fnName] === 'function') {
		win[fnName](args);
	} else {
		console.warn('Game bridge function not ready yet:', fnName);
	}
}
</script>

<!-- Multiplayer position sync via Firebase Realtime Database. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
	apiKey: "AIzaSyAIHKweVYMzjVrHKMsyPZkRs0UPMHTRs80",
	authDomain: "test-web-deploy-41186.firebaseapp.com",
	databaseURL: "https://test-web-deploy-41186-default-rtdb.europe-west1.firebasedatabase.app",
	projectId: "test-web-deploy-41186",
	storageBucket: "test-web-deploy-41186.firebasestorage.app",
	messagingSenderId: "1023177315619",
	appId: "1:1023177315619:web:90e40575840f5aaf81a896"
};
firebase.initializeApp(firebaseConfig);

const mpMyId = 'p' + Math.random().toString(36).slice(2, 10);
const mpPlayersRef = firebase.database().ref('players');
const mpMyRef = mpPlayersRef.child(mpMyId);
mpMyRef.onDisconnect().remove();

let mpLatestPlayers = {};
mpPlayersRef.on('value', (snap) => {
	mpLatestPlayers = snap.val() || {};
});

window.mpUpdate = function (x, y, z, ry, anim) {
	mpMyRef.set({ x: x, y: y, z: z, ry: ry, anim: anim || 'idle', t: Date.now() });
};

window.mpGetPlayersJSON = function () {
	const now = Date.now();
	const out = {};
	for (const id in mpLatestPlayers) {
		if (id === mpMyId) continue;
		const p = mpLatestPlayers[id];
		if (!p || now - p.t > 8000) continue; // drop stale/disconnected entries
		out[id] = p;
	}
	return JSON.stringify(out);
};

const mpChatRef = firebase.database().ref('chat');
let mpLatestChat = [];
mpChatRef.limitToLast(50).on('value', (snap) => {
	const list = [];
	snap.forEach((child) => {
		list.push(child.val());
	});
	mpLatestChat = list;
});

const CHAT_RETENTION = 50;

window.mpSendChat = function (text) {
	if (!text) return;
	text = String(text).slice(0, 200);
	mpChatRef.push({ id: mpMyId, text: text, t: Date.now() });
	// limitToLast() above only bounds what's *read* - Firebase keeps every
	// message ever pushed forever otherwise. Since there's no backend to run
	// scheduled cleanup, whoever sends a message also trims stored history
	// beyond the retention window (distributed janitor pattern).
	mpChatRef.once('value').then((snap) => {
		const keys = [];
		// Array.push() body must be braced: push() returns the new length (a
		// truthy number), and DataSnapshot.forEach() cancels iteration early
		// on any truthy callback return - an unbraced arrow here silently
		// stops after the very first child.
		snap.forEach((child) => { keys.push(child.key); });
		keys.sort(); // push() keys are lexicographically chronological
		const excess = keys.length - CHAT_RETENTION;
		if (excess > 0) {
			const updates = {};
			for (let i = 0; i < excess; i++) updates[keys[i]] = null;
			mpChatRef.update(updates);
		}
	});
};

window.mpGetChatJSON = function () {
	return JSON.stringify(mpLatestChat);
};

const mpSkinsRef = firebase.database().ref('skins');
mpSkinsRef.child(mpMyId).onDisconnect().remove();
window.mpMySkin = '';

let mpLatestSkins = {};
mpSkinsRef.on('value', (snap) => {
	mpLatestSkins = snap.val() || {};
});

document.getElementById('skinUpload').addEventListener('change', function (e) {
	const file = e.target.files[0];
	if (!file) return;
	const reader = new FileReader();
	reader.onload = function (ev) {
		const img = new Image();
		img.onload = function () {
			const canvas = document.createElement('canvas');
			canvas.width = 256;
			canvas.height = 256;
			const ctx = canvas.getContext('2d');
			ctx.drawImage(img, 0, 0, 256, 256);
			const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
			window.mpMySkin = dataUrl;
			// Stored with a timestamp (unlike the raw string before) so stale
			// entries can be detected even if onDisconnect never fires.
			mpSkinsRef.child(mpMyId).set({ data: dataUrl, t: Date.now() });
		};
		img.src = ev.target.result;
	};
	reader.readAsDataURL(file);
});

window.mpGetMySkin = function () {
	return window.mpMySkin || '';
};

window.mpGetSkinsJSON = function () {
	// Unwrap to plain {id: dataUrl}, same shape as before, so the Godot side
	// needs no changes. Skip anything whose owner isn't an active player.
	const now = Date.now();
	const out = {};
	for (const id in mpLatestSkins) {
		const entry = mpLatestSkins[id];
		if (!entry || !entry.data) continue;
		const owner = mpLatestPlayers[id];
		const ownerActive = id === mpMyId || (owner && now - owner.t <= 8000);
		if (!ownerActive) continue;
		out[id] = entry.data;
	}
	return JSON.stringify(out);
};

const SKIN_GC_INTERVAL_MS = 15000;
const SKIN_MAX_AGE_MS = 5 * 60 * 1000; // absolute safety net regardless of player state

setInterval(() => {
	const now = Date.now();
	for (const id in mpLatestSkins) {
		if (id === mpMyId) continue;
		const entry = mpLatestSkins[id];
		if (!entry) continue;
		const owner = mpLatestPlayers[id];
		const ownerGone = !owner || now - owner.t > 8000;
		const tooOld = !entry.t || now - entry.t > SKIN_MAX_AGE_MS;
		if (ownerGone || tooOld) {
			mpSkinsRef.child(id).remove();
		}
	}
}, SKIN_GC_INTERVAL_MS);
</script>

</body>
</html>
